# Test, build, drive the built site in headless Chrome, deploy to GitHub Pages, check the live site, ping IndexNow.
# Runs on every push to main, by hand, and weekly (a weekly rebuild keeps the "due for a re-check" notices current).
# Fails safe: any failed test or check stops before deploy, so the last good site stays live.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"   # Mondays 07:23 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
  PRO_URL: ${{ vars.PRO_URL }}
  PRO_LABEL: ${{ vars.PRO_LABEL }}
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/js/*.test.mjs
          python3 pipeline/validate_states.py data/states
      - name: Build
        run: python3 pipeline/build.py
      - name: Drive the built site in headless Chrome
        run: scripts/e2e.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: urls
          path: dist/urls.txt
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  after-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: urls
      - name: Smoke-test the live site
        run: |
          for attempt in 1 2 3; do
            scripts/e2e.sh "$SITE_URL/" && exit 0
            sleep 60
          done
          exit 1
      - name: Tell search engines (IndexNow)
        run: python3 scripts/indexnow.py urls.txt
